# Tracker parameters used for all results in the paper. Read by
# `tracker/track --config`; tracking.c has the same defaults.
# Symbols and sections refer to the paper; times in us unless named otherwise.

# III-A: period at each pixel (hot pixels are removed by evaluation/events.py)
dt = 0.01                  # Delta, s
bbox_interval_ms = 10      # Delta
max_period_us = 32768      # longer periods give no reading

# III-B: weight and position update
target_freq = 220          # 1 / p_ideal, Hz; set for the insect to find
max_k = 3                  # k in Eq. 2; 1 turns sub-harmonics off
sigma_d = 80               # sigma_d, px
sigma_p = 900              # sigma_p
wmax = 0.3                 # w_max
wmin = 1e-6                # w_min

# III-C: boxes
bbox_radius = 17           # r_b, px
bbox_window_us = 20000     # T_b
bbox_min_matches = 5       # m
bbox_pad = 3               # px added on each side

# III-D: several trackers
spawn_max_dp = 300         # delta_s
spawn_dist = 60            # r_s, px
lock_bonus = 3             # beta
unlocked_grace_us = 100000 # T_g

# III-E: background test
background_gate = true
bg_window_us = 128000      # T_w
bg_pad = 4                 # px the box is grown by
bg_bin_us = 500            # L = T_w / 500 us = 256
bg_min_events = 8000       # N
bg_fmin = 50               # f_min, Hz
bg_fmax = 850              # f_max, Hz
bg_max_peak = 6            # hide when S < 6
bg_clear_peak = 50         # show again when S >= 50
bg_small_frac = 0.15       # boxes with < 0.15 N events are shown
bg_inherit_px = 120        # new trackers this close to a box
bg_inherit_us = 300000     # hidden this recently start hidden
